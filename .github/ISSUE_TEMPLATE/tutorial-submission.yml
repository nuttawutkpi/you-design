name: 📺 Submit a tutorial
description: Share an YouDesign tutorial video to be featured on you-design.ai/tutorials.
title: "[Tutorial]: "
labels: ["tutorials"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing! Made or found a great YouDesign tutorial on YouTube? Fill in the video link below — that's the only required field. A maintainer will review it and add it to the tutorials page. No pull request or markdown needed.

  - type: input
    id: video_url
    attributes:
      label: YouTube video URL
      description: Paste the full link, e.g. https://www.youtube.com/watch?v=XXXXXXXXXXX
      placeholder: https://www.youtube.com/watch?v=...
    validations:
      required: true