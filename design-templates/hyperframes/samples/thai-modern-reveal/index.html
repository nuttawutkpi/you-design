<!DOCTYPE html>
<html lang="th">
<head><meta charset="utf-8"><title>Thai Modern Reveal</title>
<style>
:root { --bg:#FBF7F0; --surface:#FFFFFF; --accent:#C0512F; --fg:#1A1714; --fg-2:#4A413A; --muted:#8A7E72; }
body { font-family: "Noto Sans Thai", "Noto Sans", "Inter", system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 12vh 12vw; }
.scene-content { max-width: 800px; }
.eyebrow { font-size: 14px; font-weight: 500; letter-spacing: 0.12em; color: var(--accent); text-transform: uppercase; margin-bottom: 24px; }
.headline { font-size: 96px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 24px; }
.subtitle { font-size: 24px; font-weight: 400; line-height: 1.6; color: var(--fg-2); margin-bottom: 48px; }
.accent-rule { width: 96px; height: 4px; background: var(--accent); border-radius: 2px; }
</style>
</head>
<body>
<div class="scene-content">
  <div class="eyebrow">THAI · MODERN</div>
  <h1 class="headline">ดีไซน์เรียบง่าย ใช้งานได้จริง</h1>
  <p class="subtitle">พื้นที่ของคนทำงานที่อยากควบคุมทุกรายละเอียด ตั้งแต่โทนสี ฟอนต์ ไปจนถึงจังหวะการเคลื่อนไหว</p>
  <div class="accent-rule"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = gsap.timeline({ paused: true });
  const tl = window.__timelines["main"];
  tl.from(".eyebrow", { opacity: 0, y: 12, duration: 0.5, ease: "power2.out" }, 0.3);
  tl.from(".headline", { opacity: 0, y: 24, duration: 0.7, ease: "power3.out" }, 0.5);
  tl.from(".subtitle", { opacity: 0, y: 16, duration: 0.6, ease: "power2.out" }, 0.9);
  tl.from(".accent-rule", { scaleX: 0, duration: 0.8, ease: "expo.out", transformOrigin: "left center" }, 1.2);
  tl.to(".scene-content", { opacity: 0, y: -12, duration: 0.5, ease: "power2.in" }, 5.3);
</script>
</body>
</html>
